<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Iniciar sesión</h1>
        @if (error()) {
          <div class="alert alert-danger py-2">{{ error() }}</div>
        }
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input id="username" class="form-control" formControlName="username" autocomplete="username"
              [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input id="password" type="password" class="form-control" formControlName="password"
              autocomplete="current-password"
              [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid" />
          </div>
          <button class="btn btn-primary w-100" [disabled]="loading()">
            {{ loading() ? 'Entrando…' : 'Entrar' }}
          </button>
        </form>
        <p class="text-center mt-3 mb-0 small">
          ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
        </p>
      </div>
    </div>
  </div>
</div>
