<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Crear cuenta</h1>
        @if (error()) {
          <div class="alert alert-danger py-2">{{ error() }}</div>
        }
        @if (success()) {
          <div class="alert alert-success py-2">
            {{ success() }}. <a routerLink="/login">Iniciar sesión</a>
          </div>
        }
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input id="username" class="form-control" formControlName="username" autocomplete="username"
              [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid" />
            <div class="invalid-feedback">Obligatorio (sin los caracteres &lt; &gt;).</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input id="password" type="password" class="form-control" formControlName="password"
              autocomplete="new-password"
              [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid" />
            <div class="invalid-feedback">Mínimo 4 caracteres.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm">Confirmar contraseña</label>
            <input id="confirm" type="password" class="form-control" formControlName="confirm"
              autocomplete="new-password"
              [class.is-invalid]="form.controls.confirm.touched && form.hasError('mismatch')" />
            <div class="invalid-feedback">Las contraseñas no coinciden.</div>
          </div>
          <button class="btn btn-primary w-100" [disabled]="loading()">
            {{ loading() ? 'Registrando…' : 'Registrarse' }}
          </button>
        </form>
        <p class="text-center mt-3 mb-0 small">
          ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
